// D2D EXPRESS - Flutter-style UI with Firebase Backend (Prototype)

import React from "react"; import { View, Text, TextInput, Button, ScrollView, Alert } from "react-native"; import firestore from "@react-native-firebase/firestore";

export default function D2DTrackingApp() { const [trackingId, setTrackingId] = React.useState(""); const [status, setStatus] = React.useState(null);

const trackParcel = async () => { if (!trackingId.trim()) { Alert.alert("Please enter a tracking number."); return; }

try {
  const doc = await firestore()
    .collection("parcels")
    .doc(trackingId)
    .get();

  if (doc.exists) {
    setStatus(doc.data());
  } else {
    Alert.alert("Tracking ID not found.");
    setStatus(null);
  }
} catch (error) {
  console.error("Error fetching tracking info:", error);
  Alert.alert("Error fetching data.");
}

};

return ( <ScrollView style={{ padding: 20 }}> <Text style={{ fontSize: 24, fontWeight: "bold", marginBottom: 20 }}> D2D EXPRESS - Track Your Shipment </Text>

<TextInput
    placeholder="Enter Tracking Number"
    style={{ borderWidth: 1, borderColor: "#ccc", padding: 10, marginBottom: 10 }}
    value={trackingId}
    onChangeText={setTrackingId}
  />

  <Button title="Track Now" onPress={trackParcel} />

  {status && (
    <View style={{ marginTop: 30 }}>
      <Text style={{ fontSize: 18, fontWeight: "bold" }}>Tracking ID: {trackingId}</Text>
      <Text style={{ fontSize: 16, marginTop: 10 }}>Current Status: {status.current_status}</Text>

      <View style={{ marginTop: 20 }}>
        <Text style={{ fontWeight: "bold" }}>Tracking Timeline:</Text>
        {status.timeline.map((item, index) => (
          <Text key={index}>• {item.status} - {item.time}</Text>
        ))}
      </View>
    </View>
  )}
</ScrollView>

); }

